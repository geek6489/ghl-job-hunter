# Hourly job monitoring without a paid server.
# Runs the scan, digests, daily summary and maintenance once, then exits.
# Needs repository secrets (Settings > Secrets and variables > Actions); see docs/FREE_SETUP.md.
name: Hourly job monitor

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC (GitHub may start it a few minutes late)
  workflow_dispatch: {}   # "Run workflow" button for a scan on demand

concurrency:
  group: job-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scheduled tasks once
        run: python -m app.run_once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'Asia/Karachi' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_INPUT_PRICE_PER_MTOK: ${{ vars.CLAUDE_INPUT_PRICE_PER_MTOK || '4' }}
          CLAUDE_OUTPUT_PRICE_PER_MTOK: ${{ vars.CLAUDE_OUTPUT_PRICE_PER_MTOK || '20' }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
