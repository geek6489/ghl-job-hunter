<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Opportunities · GHL Job Hunter{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
{% if request.session.get("user") %}
<div class="shell">
<aside class="side">
  <a class="brand" href="/"><span class="logo">◆</span><span>Opportunities<small>GHL Job Hunter</small></span></a>
  <nav>
    <a href="/" class="{{ 'on' if nav=='overview' }}"><i>▦</i>Board</a>
    <a href="/jobs" class="{{ 'on' if nav in ('jobs','job_detail') }}"><i>☰</i>All jobs</a>
    <a href="/tracker" class="{{ 'on' if nav=='tracker' }}"><i>✓</i>Tracker</a>
    <a href="/summaries" class="{{ 'on' if nav=='summaries' }}"><i>✎</i>Summaries</a>
    <a href="/settings" class="{{ 'on' if nav=='settings' }}"><i>⚙</i>Settings</a>
    <a href="/health" class="{{ 'on' if nav=='health' }}"><i>♥</i>Health</a>
  </nav>
  <form method="post" action="/logout" class="signout"><button class="link">Sign out</button></form>
</aside>
<main class="wrap">{% block content %}{% endblock %}</main>
</div>
{% else %}
<main class="wrap">{{ self.content() }}</main>
{% endif %}
<script>
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const src = document.getElementById(btn.dataset.copy);
  const html = src.querySelector('.msg-html').innerHTML;
  const text = src.querySelector('.msg-text').value;
  const plain = btn.dataset.mode === 'text';
  try {
    if (!plain && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], {type: 'text/html'}),
        'text/plain': new Blob([text], {type: 'text/plain'})})]);
    } else {
      await navigator.clipboard.writeText(text);
    }
  } catch (err) {
    const ta = src.querySelector('.msg-text'); ta.hidden = false; ta.select(); document.execCommand('copy'); ta.hidden = true;
  }
  const old = btn.textContent; btn.textContent = 'Copied ✓'; btn.classList.add('done');
  setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1600);
});
</script>
</body></html>
